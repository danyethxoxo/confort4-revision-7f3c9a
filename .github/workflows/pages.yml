name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generar y verificar páginas y formularios
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-pages.mjs
          node scripts/check-pages.mjs
          node --check dist/site.mjs
          node --check dist/admin.mjs
          node --experimental-strip-types tests/forms.test.mjs
          node --experimental-strip-types tests/site.test.mjs
          node tests/motion.test.mjs
          node tests/reviews.test.mjs
          node tests/ui.test.mjs
          node tests/header.test.mjs
          node tests/privacy.test.mjs
          node tests/privacy-editor.test.mjs
          node tests/home-modules.test.mjs
          node tests/property-sdr.test.mjs
          node --experimental-strip-types tests/photo-gateway.test.mjs
          node scripts/fetch-public-snapshot.mjs
          node scripts/prepare-property-photos.mjs --live
          node scripts/build-pages.mjs --live
          node scripts/check-pages.mjs
          node tests/seo.test.mjs
          node tests/photo-loading.test.mjs
          node tests/deployment-config.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
